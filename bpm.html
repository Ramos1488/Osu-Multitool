<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0d12"><title data-i18n="titleBpm">BPM тест · osu!multitool</title><link rel="icon" type="image/svg+xml" href="assets/om-mark.svg"><link rel="stylesheet" href="css/style.css">
<header><a class="brand" href="/" aria-label="osu!multitool — главная" data-i18n-aria="homeLabel"><img src="assets/om-mark.svg" alt=""><span><strong>osu!</strong><i>multitool</i></span></a><nav id="nav" data-active="bpm"></nav><form id="hs"><input placeholder="Поиск игрока" aria-label="Поиск игрока" data-i18n-placeholder="searchPlayer"></form><span id="login"></span></header>
<main>
<section class="page-intro"><h2 data-i18n="bpmTestTitle">BPM тест</h2><p data-i18n="bpmTestDesc">Проверь скорость нажатий и сравни её со своим привычным темпом.</p></section><div class="card"><div class="bpm-grid">
<label><span data-i18n="bpmTarget">Целевой BPM</span><div class="inline"><input id="bt" type="number" min="30" max="500" value="180"><input id="bs" type="range" min="60" max="400" value="180" aria-label="BPM"></div></label>
<label><span data-i18n="bpmRate">Скорость (рейт)</span><div class="inline"><input id="rt" type="number" min="0.25" max="3" step="0.05" value="1"><button class="rate-btn" data-rate="0.75">HT</button><button class="rate-btn" data-rate="1">NM</button><button class="rate-btn" data-rate="1.5">DT</button></div></label>
<label><span data-i18n="bpmSnap">Деление</span><select id="sn"><option value="1">1/1</option><option value="2">1/2</option><option value="3">1/3</option><option value="4" selected>1/4</option><option value="6">1/6</option></select></label>
<label><span data-i18n="bpmDuration">Длительность, с</span><select id="du"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>60</option></select></label></div>
<div class="row"><select id="kn" aria-label="Количество клавиш"><option>1<option selected>2<option>3<option>4</select><button id="ks" data-i18n="chooseKeys">Выбрать клавиши</button><b id="kl">Z + X</b><label class="chk"><input type="checkbox" id="mt" checked><span data-i18n="metronome">Метроном</span></label><button id="go" data-i18n="start">Старт</button></div>
<p class="dim" data-i18n="bpmHelp"></p>
<div class="bpm-read"><div id="beat" class="beat"></div><div><div id="bv" class="big">0</div><div class="dim"><span data-i18n="effectiveBpm">Итоговый BPM</span>: <b id="eff">180</b> · <span id="bsub"></span></div></div></div><div id="bres"></div></div>
